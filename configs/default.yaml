project:
  seed: 42
  data_path: dataset/hdb_resale_2022_2025_cleaned.csv
  artifacts_dir: artifacts
  reports_dir: reports

data:
  target: resale_price
  split_column: split_group
  train_label: TRAIN
  validation_label: VALIDATION
  test_label: TEST
  numeric_features:
    - floor_area_sqm
    - storey_mid
    - remaining_lease_months
    - relative_floor
    - time_index
    - max_floor_lvl
    - total_dwelling_units
    - month_sin
    - month_cos
  categorical_features:
    - town
    - flat_type
    - flat_model
  binary_features:
    - commercial_flag
    - market_hawker_flag
    - multistorey_carpark_flag
    - precinct_pavilion_flag
  leakage_columns:
    - price_per_sqm
    - record_id
    - address_key
    - split_group
    - price_outlier_flag
    - possible_duplicate_group_size

ridge:
  alphas: [0.1, 1.0, 10.0, 100.0]

xgboost:
  device: auto
  tune_trials: 20
  n_estimators: 3000
  early_stopping_rounds: 100
  learning_rates: [0.02, 0.03, 0.05]
  max_depths: [4, 5, 6, 7]
  min_child_weights: [1, 3, 5, 10]
  subsamples: [0.75, 0.85, 1.0]
  colsample_bytrees: [0.75, 0.85, 1.0]
  reg_alphas: [0.0, 0.01, 0.1]
  reg_lambdas: [1.0, 3.0, 10.0]

hybrid:
  high_cardinality_features: [address_key, street_name, block]
  smoothing:
    address_key: 10.0
    street_name: 30.0
    block: 30.0
  oof_folds: 5
  n_estimators: 5000
  early_stopping_rounds: 150
  learning_rate: 0.03
  max_depth: 7
  min_child_weight: 10
  subsample: 1.0
  colsample_bytree: 0.85
  reg_alpha: 0.0
  reg_lambda: 1.0

flow:
  device: auto
  hidden_dims: [256, 256, 128]
  time_embedding_dim: 32
  dropout: 0.05
  batch_size: 1024
  num_workers: 0
  max_epochs: 200
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  early_stopping_patience: 20
  lr_patience: 7
  lr_factor: 0.5
  min_learning_rate: 0.000001
  ema_decay: 0.999
  amp: true
  sampling_steps: 64
  validation_samples: 100
  test_samples: 100
  prediction_batch_rows: 512

evaluation:
  interval_alpha: 0.2
